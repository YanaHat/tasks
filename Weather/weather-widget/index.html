<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/src/style.css" />
    <title>Glassmorphism Weather Dashboard</title>
  </head>
  <body>
    <div class="container">
      <div class="headContainer">
        <div class="logo">
          <span class="material-symbols-outlined text-primary text-3xl">cloud</span>
          <h1 class="title">SkyGlass <span class="subtitle">Forecast</span></h1>
        </div>
        <div class="search">
          <span class="material-symbols-outlined ml-4 text-slate-400">search</span>
          <input id="cityInput" type="text" name="city" placeholder="Enter city!"/>
          <button id="searchBtn">Search</button>
        </div>
        <div id="historyContainer"></div>
      </div>
      <div id="weatherContainer"></div>
      <div id="errorMessage"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
